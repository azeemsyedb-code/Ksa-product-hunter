name: Weekly Excel Export

on:
  schedule:
    - cron: "0 7 * * 5"  # Every Friday 07:00 UTC (~10:00 KSA time)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly export
        run: python weekly_export.py
        working-directory: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit export file
        run: |
          git config user.name "product-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/exports/
          git diff --staged --quiet || git commit -m "Weekly export: $(date -u +%Y-%m-%d)"
          git push
